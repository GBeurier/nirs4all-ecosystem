name: Qualify locked Windows CLI candidates

on:
  workflow_call:
    inputs:
      packages:
        description: JSON array of owner repository, exact SHA and package
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(inputs.packages) }}
    runs-on: windows-latest
    name: ${{ matrix.member.package }} (Windows x64)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.member.origin }}
          ref: ${{ matrix.member.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - name: Build and exercise the owner binary
        shell: pwsh
        env:
          PACKAGE: ${{ matrix.member.package }}
          REVISION: ${{ matrix.member.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD) -ne $env:REVISION) { throw "Unexpected source revision" }
          cargo test --release --locked -p $env:PACKAGE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p $env:PACKAGE --bins --message-format=json > build.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaries = @(Get-Content build.jsonl | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.kind -contains 'bin' -and $_.executable })
          if ($binaries.Count -ne 1) { throw "Expected one release binary" }
          New-Item -ItemType Directory -Path delivery
          Copy-Item -LiteralPath $binaries[0].executable -Destination delivery/
          $hash = Get-FileHash -LiteralPath $binaries[0].executable -Algorithm SHA256
          @{package=$env:PACKAGE; commit=$env:REVISION; target='x86_64-pc-windows-msvc'; sha256=$hash.Hash;
            lock_sha256=(Get-FileHash Cargo.lock).Hash; rustc=(rustc -V)} |
            ConvertTo-Json | Set-Content delivery/receipt.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.member.package }}-windows-x64
          path: delivery/
          if-no-files-found: error
