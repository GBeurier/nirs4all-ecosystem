name: Ecosystem artifact graph

on:
  pull_request:
    paths:
      - '.github/workflows/artifact-graph-plan.yml'
      - '.gitmodules'
      - 'docs/contracts/release/artifact-graph.n4a.json'
      - 'docs/contracts/release/artifact-release-targets.n4a.json'
      - 'scripts/n4a_artifact_graph.py'
      - 'tests/test_artifact_graph.py'
  workflow_dispatch:
    inputs:
      selection_type:
        description: Choose an artifact, repository or full qualification plan
        required: true
        type: choice
        options: [artifact, repository, full]
      selection:
        description: Artifact or repository ID (leave empty for full)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify graph behavior
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_artifact_graph.py
      - name: Compute the artifact plan
        env:
          SELECTION_TYPE: ${{ inputs.selection_type || 'artifact' }}
          SELECTION: ${{ inputs.selection || (github.event_name == 'pull_request' && 'io.core-crate') || '' }}
        run: |
          case "$SELECTION_TYPE" in
            artifact|repository)
              python scripts/n4a_artifact_graph.py "--$SELECTION_TYPE" "$SELECTION" > artifact-plan.json
              ;;
            full)
              test -z "$SELECTION"
              python scripts/n4a_artifact_graph.py --full > artifact-plan.json
              ;;
            *)
              exit 2
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ecosystem-artifact-plan
          path: artifact-plan.json
          if-no-files-found: error
