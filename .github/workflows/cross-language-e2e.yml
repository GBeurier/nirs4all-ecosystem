name: Cross-language E2E scenarios

on:
  pull_request:
  push:
    branches: [main, "rc/**"]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario id to execute; leave empty to plan all"
        required: false
        type: string
      execute:
        description: "Run commands instead of dry planning"
        required: true
        default: false
        type: boolean
      allow_blocked:
        description: "For run-ready execution, allow declared blocked scenarios to remain blocked after ready scenarios pass"
        required: true
        default: true
        type: boolean

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    env:
      N4A_WORKSPACE_ROOT: ${{ github.workspace }}/nirs4all-ecosystem
      N4A_E2E_MAX_ARTIFACT_AGE_SECONDS: "14400"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: nirs4all-ecosystem
    steps:
      - name: Checkout ecosystem contract runner
        uses: actions/checkout@v4
        with:
          path: nirs4all-ecosystem
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Disable flaky preinstalled Microsoft apt feeds
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.sources
        working-directory: ${{ github.workspace }}
      - uses: r-lib/actions/setup-r@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system E2E tool shims
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
        working-directory: ${{ github.workspace }}
      - name: Install test dependencies
        run: python3 -m pip install pytest
      - name: Install executed E2E package dependencies
        if: ${{ github.event.inputs.execute == 'true' }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            -e "nirs4all[dev]" \
            -e "nirs4all-datasets[dev,nirs4all,io]" \
            -e "nirs4all-repository[dev,nirs4all,datasets]" \
            -e "nirs4all-providers[dev,all]" \
            -e "nirs4all-io[dev,parquet]" \
            -e "nirs4all-papers[dev]" \
            -e "nirs4all-tools[dev,duckdb,parquet]" \
            -e "nirs4all-cluster[dev]" \
            -e "nirs4all-core/bindings/python"
          npm --prefix nirs4all-web/studio-lite ci --no-audit --no-fund
      - name: Validate scenario contract
        run: python3 scripts/n4a_e2e_scenarios.py validate
      - name: Run pytest validation
        run: python3 -m pytest -q tests/test_e2e_scenarios.py
      - name: Write coverage debt board
        run: >
          python3 scripts/n4a_e2e_scenarios.py coverage
          --json-out .n4a-e2e-artifacts/coverage/coverage-summary.json
          --markdown-out .n4a-e2e-artifacts/coverage/coverage-debt.md
      - name: Plan all scenarios
        if: ${{ !github.event.inputs.scenario && github.event.inputs.execute != 'true' }}
        run: python3 scripts/n4a_e2e_scenarios.py plan
      - name: Execute ready scenarios
        if: ${{ !github.event.inputs.scenario && github.event.inputs.execute == 'true' }}
        env:
          N4A_ALLOW_BLOCKED: ${{ github.event.inputs.allow_blocked }}
        run: |
          args=(run-ready --execute)
          if [[ "$N4A_ALLOW_BLOCKED" == "true" ]]; then
            args+=(
              --allow-blocked
              --allowed-blocked-scenario e2e-r-dataset-io-pipeline-save
              --allowed-blocked-requirement e2e-r-dataset-io-pipeline-save=nirs4all-datasets/datasets/malaria_anopheles_gambiae_sporozoite_nir/canonical/dataset.json
            )
          fi
          python3 scripts/n4a_e2e_scenarios.py "${args[@]}"
      - name: Verify ready scenario artifacts
        if: ${{ !github.event.inputs.scenario && github.event.inputs.execute == 'true' }}
        run: >
          python3 scripts/n4a_e2e_scenarios.py evidence
          --ready-only
          --max-age-seconds "$N4A_E2E_MAX_ARTIFACT_AGE_SECONDS"
          --json-out .n4a-e2e-artifacts/evidence-summary.json
      - name: Check committed runtime evidence ledger
        if: ${{ !github.event.inputs.scenario && github.event.inputs.execute == 'true' }}
        run: >
          python3 scripts/n4a_e2e_scenarios.py evidence-ledger
          --check
          --max-age-seconds "$N4A_E2E_MAX_ARTIFACT_AGE_SECONDS"
          --out docs/contracts/e2e/latest-runtime-evidence-ledger.n4a.json
      - name: Plan selected scenario
        if: ${{ github.event.inputs.scenario && github.event.inputs.execute != 'true' }}
        env:
          N4A_E2E_SCENARIO: ${{ github.event.inputs.scenario }}
        run: python3 scripts/n4a_e2e_scenarios.py plan --scenario "$N4A_E2E_SCENARIO"
      - name: Execute selected scenario
        if: ${{ github.event.inputs.scenario && github.event.inputs.execute == 'true' }}
        env:
          N4A_E2E_SCENARIO: ${{ github.event.inputs.scenario }}
          N4A_ALLOW_BLOCKED: ${{ github.event.inputs.allow_blocked }}
        run: |
          args=(run "$N4A_E2E_SCENARIO" --execute)
          if [[ "$N4A_ALLOW_BLOCKED" == "true" ]]; then
            args+=(--allow-blocked)
          fi
          python3 scripts/n4a_e2e_scenarios.py "${args[@]}"
      - name: Verify selected scenario artifacts
        if: ${{ github.event.inputs.scenario && github.event.inputs.execute == 'true' }}
        env:
          N4A_E2E_SCENARIO: ${{ github.event.inputs.scenario }}
        run: >
          python3 scripts/n4a_e2e_scenarios.py evidence
          --scenario "$N4A_E2E_SCENARIO"
          --max-age-seconds "$N4A_E2E_MAX_ARTIFACT_AGE_SECONDS"
          --json-out .n4a-e2e-artifacts/evidence-summary.json
      - name: Upload coverage debt board
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: n4a-e2e-coverage-debt-${{ github.run_id }}
          path: nirs4all-ecosystem/.n4a-e2e-artifacts/coverage/**
          if-no-files-found: warn
      - name: Upload ready scenario evidence
        if: ${{ always() && !github.event.inputs.scenario && github.event.inputs.execute == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: n4a-e2e-ready-runtime-evidence-${{ github.run_id }}
          path: nirs4all-ecosystem/.n4a-e2e-artifacts/**
          if-no-files-found: warn
      - name: Upload selected scenario evidence
        if: ${{ always() && github.event.inputs.scenario && github.event.inputs.execute == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: n4a-e2e-${{ github.event.inputs.scenario }}-runtime-evidence-${{ github.run_id }}
          path: nirs4all-ecosystem/.n4a-e2e-artifacts/**
          if-no-files-found: warn
