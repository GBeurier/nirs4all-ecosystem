name: Cross-language contract checks

on:
  pull_request:
  push:
    branches: [main, "rc/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nirs4all-ecosystem
    steps:
      - name: Checkout ecosystem contract runner
        uses: actions/checkout@v7
        with:
          path: nirs4all-ecosystem
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install contract test dependencies
        run: python3 -m pip install pytest pyyaml
      - name: Validate cross-language contract
        run: python3 scripts/n4a_e2e_scenarios.py validate
      - name: Test contract runner
        run: >
          python3 -m pytest -q tests/test_e2e_scenarios.py
          -k "not current_workspace_plans_all_complex_workflows_ready and not cli_coverage_json_exposes_readiness_and_gaps and not cli_run_ready_dry_run_lists_ready_and_blocked"
      - name: Write coverage debt board
        run: >
          python3 scripts/n4a_e2e_scenarios.py coverage
          --json-out .n4a-e2e-artifacts/coverage/coverage-summary.json
          --markdown-out .n4a-e2e-artifacts/coverage/coverage-debt.md
      - name: Plan all scenarios
        run: python3 scripts/n4a_e2e_scenarios.py plan --json > .n4a-e2e-artifacts/plan.json
      - name: Upload contract plan
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: n4a-e2e-contract-plan-${{ github.run_id }}
          path: nirs4all-ecosystem/.n4a-e2e-artifacts/**
          include-hidden-files: true
          if-no-files-found: error
