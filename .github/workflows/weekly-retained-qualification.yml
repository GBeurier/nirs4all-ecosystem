name: Weekly retained artifact qualification

on:
  schedule:
    - cron: '15 2 * * 6'
      timezone: Europe/Paris
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/weekly-retained-qualification.yml
      - docs/contracts/release/cohort/friday-tagged.n4a.json

permissions:
  contents: read

concurrency:
  group: weekly-retained-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    outputs:
      studio-sha: ${{ steps.pins.outputs.studio-sha }}
      studio-tag: ${{ steps.pins.outputs.studio-tag }}
      domains-sha: ${{ steps.pins.outputs.domains-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Freeze the reviewed baseline and enumerate full coverage
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          graph=docs/contracts/release/artifact-graph.n4a.json
          cohort=docs/contracts/release/cohort/friday-tagged.n4a.json
          studio=$(jq -er '.members.studio.expected_commit' "$cohort")
          studio_ref=$(jq -er '.members.studio.ref' "$cohort")
          domains=$(jq -er '.reviewed_sources["nirs4all-domains"]' "$graph")
          [[ "$studio" =~ ^[0-9a-f]{40}$ && "$domains" =~ ^[0-9a-f]{40}$ ]]
          [[ "$studio_ref" =~ ^refs/tags/([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          printf 'studio-sha=%s\nstudio-tag=%s\ndomains-sha=%s\n' "$studio" "${BASH_REMATCH[1]}" "$domains" >> "$GITHUB_OUTPUT"
          python3 scripts/n4a_artifact_graph.py --full > full-artifact-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-full-plan
          path: full-artifact-plan.json
          if-no-files-found: error

  tagged-source:
    uses: ./.github/workflows/candidate-cohort.yml
    with:
      manifest: docs/contracts/release/cohort/friday-tagged.n4a.json
      qualification_only: true

  web:
    uses: ./.github/workflows/graph-io-web.yml
    with:
      mode: retained

  studio:
    needs: baseline
    uses: ./.github/workflows/studio-hotfix-artifact-rehearsal.yml
    with:
      studio_sha: ${{ needs.baseline.outputs.studio-sha }}
      studio_tag: ${{ needs.baseline.outputs.studio-tag }}
      qualification_only: true

  domains:
    name: Domains tests with retained Preflight crates
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: dcornet/nirs4all-domains
          ref: ${{ needs.baseline.outputs.domains-sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - run: cargo test --locked -p nirs4all-domains --no-default-features --test browser --test browser_preprocessing

  release-contracts:
    uses: ./.github/workflows/native-capability-ledger.yml

  review:
    name: Weekend coverage and failures
    needs: [baseline, tagged-source, web, studio, domains, release-contracts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      BASELINE: ${{ needs.baseline.result }}
      TAGGED_SOURCE: ${{ needs.tagged-source.result }}
      WEB: ${{ needs.web.result }}
      STUDIO: ${{ needs.studio.result }}
      DOMAINS: ${{ needs.domains.result }}
      CONTRACTS: ${{ needs.release-contracts.result }}
    steps:
      - run: |
          {
            echo '## Weekly retained artifact qualification'
            echo
            echo '| Coverage | Outcome |'
            echo '| --- | --- |'
            printf '| Frozen graph and baseline | %s |\n' "$BASELINE"
            printf '| Historical tagged source cohort (Linux, full tier) | %s |\n' "$TAGGED_SOURCE"
            printf '| Web served and offline using retained WASM | %s |\n' "$WEB"
            printf '| SDK and Studio Linux locked wheels | %s |\n' "$STUDIO"
            printf '| Domains browser-profile Rust tests with retained Preflight | %s |\n' "$DOMAINS"
            printf '| Aggregation lock and native capability contracts | %s |\n' "$CONTRACTS"
            echo
            echo 'The full graph is attached as a planning artifact. Owner-specific runtime adapters, remaining platforms and live promotion remain outside this run.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$BASELINE,$TAGGED_SOURCE,$WEB,$STUDIO,$DOMAINS,$CONTRACTS" = success,success,success,success,success,success
